name: build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build single-file HTML
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Upload built HTML
        uses: actions/upload-artifact@v4
        with:
          name: quizforge-html
          path: dist/题目检测生成器.html
